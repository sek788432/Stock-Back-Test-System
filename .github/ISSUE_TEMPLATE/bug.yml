name: Bug report
description: Something is wrong, broken, or behaves unexpectedly.
title: "bug: <short title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in every section so we can reproduce.
        Skipped sections will get sent back with a "please fill out the template" comment.

  - type: input
    id: version
    attributes:
      label: App version
      description: Use the release version when known; for a source build, provide `git describe --tags --always --dirty`.
      placeholder: e.g. 0.3.0 or 0d56e15-dirty
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS arm64 (12+)
        - macOS x64 (12+)
        - Linux (specify distro below)
        - Other / multiple
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distro / version (if applicable)
      placeholder: e.g. Ubuntu 22.04, Fedora 40

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear, factual. No "it's broken" — describe the symptom.
      placeholder: "When I run a backtest with X, the equity curve shows Y instead of Z."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "I expected the equity curve to show ..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal and deterministic. Include the page, inputs, and data symbol/date range when relevant.
      placeholder: |
        1. Open the app
        2. Open the affected page
        3. Enter the exact inputs listed above
        4. Perform the action that shows the problem
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / repro data
      description: |
        Attach relevant terminal output or screenshots and identify the input fixture when possible.
        Trim to the relevant lines. Do not paste API keys, private data, or proprietary datasets.
      render: text

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your assessment)
      options:
        - low (cosmetic, rare, has workaround)
        - medium (affects normal use, has workaround)
        - high (blocks normal use, no workaround)
        - critical (data loss / crash on launch / security)
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Sanity checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I included the exact operating-system version and source/release version.
          required: true
        - label: I am not pasting secrets, API keys, or private data.
          required: true
