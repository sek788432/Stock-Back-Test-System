name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all-tests:
    name: All tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Bootstrap pinned vcpkg registry
        run: |
          git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          test "$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)" = 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install sqlite3

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          modules: qtcharts
          cache: true

      - name: Configure all tests
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: >-
          cmake --preset qt-dev
          -DBTE_BUILD_TESTS=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build all tests
        run: cmake --build --preset qt-dev --parallel

      - name: Run every registered test
        run: ctest --preset qt-dev --no-tests=error --output-on-failure

  project-standards:
    name: Project standards review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18=1:18.1.3-1ubuntu1
          clang-format-18 --version

      - name: Review the full repository against project standards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: >-
          python3 Tools/CheckProjectStandards.py
          --full-tree
          --clang-format
          --base "$BASE_SHA"
          --head "$GITHUB_SHA"

  static-analysis:
    name: Static analysis (clang-tidy, cppcheck, IWYU, scan-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap pinned vcpkg registry
        run: |
          git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          test "$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)" = 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install sqlite3

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-18=1:18.1.3-1ubuntu1 \
            clang-tidy-18=1:18.1.3-1ubuntu1 \
            clang-tools-18=1:18.1.3-1ubuntu1 \
            cppcheck=2.13.0-2ubuntu3 \
            iwyu=8.21-1build2
          clang-tidy-18 --version
          cppcheck --version
          include-what-you-use --version
          scan-build-18 --help | sed -n '1p'

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          modules: qtcharts
          cache: true

      - name: Configure compilation database
        env:
          CC: clang-18
          CXX: clang++-18
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: >-
          cmake --preset analysis
          -DBTE_BUILD_QT_APP=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Materialize generated analysis sources
        run: cmake --build --preset analysis --parallel

      - name: Run clang-tidy
        run: python3 Tools/RunStaticAnalysis.py clang-tidy

      - name: Run cppcheck
        run: python3 Tools/RunStaticAnalysis.py cppcheck

      - name: Run include-what-you-use
        run: python3 Tools/RunStaticAnalysis.py iwyu

      - name: Run clang static analyzer
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          scan-build-18 --use-analyzer=/usr/bin/clang-18 cmake -S . -B Output/scan-build -DBTE_BUILD_TESTS=OFF -DBTE_BUILD_QT_APP=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          scan-build-18 --use-analyzer=/usr/bin/clang-18 --status-bugs --keep-empty -o Output/scan-build-reports cmake --build Output/scan-build --parallel

      - name: Upload scan-build reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scan-build-reports
          path: Output/scan-build-reports
          if-no-files-found: ignore

  coverage:
    name: Changed-code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap pinned vcpkg registry
        run: |
          git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          test "$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)" = 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install sqlite3

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          modules: qtcharts
          cache: true

      - name: Install coverage tools
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement Tools/CoverageRequirements.txt
          python3 -m gcovr --version
          diff-cover --version

      - name: Configure coverage tests
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: >-
          cmake --preset coverage
          -DBTE_BUILD_QT_APP=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build coverage tests
        run: cmake --build --preset coverage --parallel

      - name: Run coverage tests
        run: ctest --preset coverage --no-tests=error

      - name: Generate coverage reports
        run: >-
          python3 -m gcovr
          --root .
          --filter 'Src/'
          --exclude 'Output/'
          --merge-mode-functions merge-use-line-min
          --decisions
          --cobertura coverage.xml
          --json coverage.json
          --markdown-summary coverage-summary.md
          --html-details coverage.html

      - name: Enforce changed-line and changed-branch coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: |
          Tools/RunCoverageGates.sh \
            coverage.xml coverage.json "$BASE_SHA" "$GITHUB_SHA" \
            "$GITHUB_SHA" coverage-summary.md

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-reports
          path: |
            coverage.html
            coverage.*.html
            coverage.xml
            coverage.json
            coverage-summary.md
            changed-line-coverage.txt
            changed-branch-coverage.txt
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev-sanitize
          - dev-tsan
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Bootstrap pinned vcpkg registry
        run: |
          git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          test "$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)" = 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install sqlite3

      - name: Install Clang sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-18=1:18.1.3-1ubuntu1 \
            libclang-rt-18-dev=1:18.1.3-1ubuntu1
          clang-18 --version

      - name: Configure sanitizer tests
        env:
          CC: clang-18
          CXX: clang++-18
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: >-
          cmake --preset "${{ matrix.preset }}"
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build sanitizer tests
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure

  merge-gate:
    name: Merge gate (all required checks)
    if: always()
    needs:
      - project-standards
      - all-tests
      - static-analysis
      - coverage
      - sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or cancelled checks
        if: needs.all-tests.result != 'success' || needs.project-standards.result != 'success' || needs.static-analysis.result != 'success' || needs.coverage.result != 'success' || needs.sanitizers.result != 'success'
        run: |
          echo "Tests, standards, analysis, sanitizers, and changed-code coverage must pass before merge."
          exit 1

      - name: Approve successful checks
        if: needs.all-tests.result == 'success' && needs.project-standards.result == 'success' && needs.static-analysis.result == 'success' && needs.coverage.result == 'success' && needs.sanitizers.result == 'success'
        run: echo "Tests, standards, analysis, sanitizers, and changed-code coverage passed."
